<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EcoTrip – CO2 da sua viagem</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header text-center py-5">
    <div class="container">
      <h1 class="header__title display-5 fw-bold mb-1">EcoTrip</h1>
      <p class="header__subtitle lead mb-0">Quanto CO2 sua viagem emite e quanto custa compensar.</p>
    </div>
  </header>
  <main class="container main py-4">
    <div class="row justify-content-center">
      <div class="col-lg-8 d-grid gap-4">
        <section class="form card border-0 shadow-sm" aria-labelledby="form-title">
          <div class="card-body p-4">
            <h2 id="form-title" class="form__title h5 mb-3">Sua viagem</h2>
            <form id="trip-form" class="row g-3">
              <div class="col-md-6">
                <label class="form-label" for="origin">Origem</label>
                <input class="form__input form-control" id="origin" list="cities" autocomplete="off" placeholder="Ex.: São Paulo">
              </div>
              <div class="col-md-6">
                <label class="form-label" for="destination">Destino</label>
                <input class="form__input form-control" id="destination" list="cities" autocomplete="off" placeholder="Ex.: Rio de Janeiro">
              </div>
              <datalist id="cities"></datalist>
              <div class="col-12">
                <label class="form-label" for="manual-distance">Ou informe a distância (km)</label>
                <input class="form__input form-control" id="manual-distance" type="number" min="1" step="1" placeholder="Use se a rota não estiver na base">
              </div>
              <div class="col-12">
                <span class="form-label d-block">Meio de transporte</span>
                <div class="row g-2" id="modes"></div>
              </div>
              <div class="col-12 d-grid">
                <button class="form__button btn btn-lg" type="submit">Calcular</button>
              </div>
              <div class="col-12"><div class="form__error alert alert-danger mb-0" id="error" role="alert" hidden></div></div>
            </form>
          </div>
        </section>
        <section class="result card border-0 shadow-sm text-center" id="result" hidden aria-labelledby="result-title">
          <div class="card-body p-4">
            <h2 id="result-title" class="result__title h5">Resultado</h2>
            <p class="result__route mb-1" id="result-route"></p>
            <p class="result__value display-4 fw-bold mb-1" id="result-emission"></p>
            <p class="result__detail text-secondary mb-0" id="result-distance"></p>
          </div>
        </section>
        <section class="compare card border-0 shadow-sm" id="compare" hidden aria-labelledby="compare-title">
          <div class="card-body p-4">
            <h2 id="compare-title" class="compare__title h5 mb-3">Comparação entre meios</h2>
            <ul class="compare__list list-unstyled mb-0" id="compare-list"></ul>
          </div>
        </section>
        <section class="credits card border-0 shadow-sm" id="credits" hidden aria-labelledby="credits-title">
          <div class="card-body p-4">
            <h2 id="credits-title" class="credits__title h5">Compensação</h2>
            <p class="credits__text mb-0" id="credits-text"></p>
          </div>
        </section>
      </div>
    </div>
  </main>
  <footer class="footer text-center py-4">Distâncias simuladas e fatores de emissão aproximados, para fins educativos.</footer>
  <script src="data/routes.js"></script>
  <script src="config.js"></script>
  <script src="calculator.js"></script>
  <script src="ui.js"></script>
  <script src="app.js"></script>
</body>
</html>
